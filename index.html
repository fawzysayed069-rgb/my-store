<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر وشريط التنقل -->
    <header class="navbar">
        <h1 class="logo">متجري</h1>
        <div class="cart-icon">
            🛒 السلة (<span id="cart-count">0</span>)
        </div>
    </header>

    <!-- قسم عرض المنتجات -->
    <main class="container">
        <h2>أحدث المنتجات</h2>
        <div class="products-grid" id="products-grid">
            <!-- سيتم إضافة كروت المنتجات هنا تلقائياً -->
        </div>
    </main>

    <!-- نافذة سلة المشتريات المنبثقة -->
    <div class="cart-modal" id="cart-modal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>سلة المشتريات</h2>
                <button class="close-btn" id="close-cart">&times;</button>
            </div>
            <div class="cart-items" id="cart-items">
                <p class="empty-cart-msg">السلة فارغة حالياً</p>
            </div>
            <div class="cart-footer">
                <div class="total-price">
                    <span>الإجمالي:</span>
                    <span id="total-amount">0</span> ج.م
                </div>
                <button class="checkout-btn" onclick="checkout()">إتمام الشراء</button>
            </div>
        </div>
    </div>

    <!-- نافذة نموذج إدخال بيانات العميل -->
    <div class="checkout-modal" id="checkout-modal">
        <div class="checkout-content">
            <div class="checkout-header">
                <h2>بيانات الشحن وتأكيد الطلب</h2>
                <button class="close-btn" id="close-checkout">&times;</button>
            </div>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="client-name">الاسم بالكامل:</label>
                    <input type="text" id="client-name" required placeholder="أدخل اسمك الثلاثي">
                </div>
                <div class="form-group">
                    <label for="client-phone">رقم الهاتف:</label>
                    <input type="tel" id="client-phone" required placeholder="01XXXXXXXXX">
                </div>
                <div class="form-group">
                    <label for="client-address">العنوان بالتفصيل:</label>
                    <textarea id="client-address" required placeholder="المحافظة، المنطقة، اسم الشارع، رقم المبنى"></textarea>
                </div>
                <div class="form-group">
                    <label for="payment-method">طريقة الدفع:</label>
                    <select id="payment-method">
                        <option value="cod">الدفع عند الاستلام (COD)</option>
                        <option value="card">بطاقة إئتمانية (قيد التطوير)</option>
                    </select>
                </div>
                <div class="checkout-summary">
                    <p>إجمالي الطلب: <strong id="checkout-total">0</strong> ج.م</p>
                </div>
                <button type="submit" class="submit-order-btn">تأكيد الطلب الآن</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
